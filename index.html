.hrow{display:flex;align-items:center;gap:12px;position:relative;width:100%}
.gear{margin-left:auto;flex:0 0 auto;width:46px;height:46px;border:0;border-radius:50%;background:#fff;color:var(--b);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}

.dday{display:inline-block;vertical-align:middle;margin-left:8px;background:var(--a);color:#082c52;font-weight:800;font-size:17px;padding:3px 10px;border-radius:10px;font-variant-numeric:tabular-nums;text-shadow:none}
.gm{font-size:17px;color:var(--g)}
main{padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
h2{font-size:22px;margin:14px 0 6px;text-wrap:balance}
.card{background:var(--card);border-radius:14px;padding:14px;margin:10px 0;border:1px solid var(--line)}
.fl{border:3px solid var(--b)}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px}
.strip button{flex:0 0 62px;min-height:68px;border:2px solid #b8cad8;background:var(--card);border-radius:12px;font:inherit;color:var(--t)}
.strip b{display:block;font-size:22px}.strip span{font-size:14px;color:var(--g)}
.strip .on{background:var(--b);border-color:var(--b);color:#fff}.strip .on span{color:#dbe8f3}
.strip .td{border-color:var(--a);border-width:4px}
button,select,input,textarea{font:inherit}
.btn{min-height:52px;padding:8px 16px;border:0;border-radius:12px;background:var(--b);color:#fff;font-weight:600}
.btn.l{background:var(--card);color:var(--b);border:2px solid var(--b)}.btn.d{background:var(--r)}.btn.g{background:#1d7a3e}
.oln{display:block;width:100%;text-align:left;margin:5px 0;padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--t)}
.oln.on2{border-color:var(--b);background:#e4ecf4;font-weight:600}
.mini{min-height:44px;padding:4px 14px;flex:0 0 auto}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}.row>*{flex:1;min-width:0}
input,select,textarea{width:100%;min-height:52px;padding:8px 12px;border:2px solid #b8cad8;border-radius:10px;background:var(--card);color:var(--t)}
textarea{min-height:150px}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #e1eaf1}
.it>span{min-width:0}
.it:last-child{border:0}.it a{flex:0 0 auto;padding:8px 10px;border-radius:10px;background:var(--s);color:var(--b);text-decoration:none;font-weight:600}
.tm{display:inline-block;background:var(--b);color:#fff;border-radius:8px;padding:1px 8px;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.arr{color:var(--b);font-weight:700}
.chv{color:var(--g);font-size:13px}
.pinfo{background:var(--s);border-radius:10px;padding:10px;margin:4px 0 10px}
.pinfo img{width:100%;max-height:170px;object-fit:cover;border-radius:10px;display:block}
.hdl{flex:0 0 46px;min-height:46px;border:0;background:var(--s);border-radius:10px;font-size:20px;color:var(--g);touch-action:none}
.pit.drg{opacity:.55;background:var(--s);border-radius:10px}
.big{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}.sm{font-size:15px;color:var(--g)}.warn{color:var(--r);font-weight:600}
.onr{background:var(--b)!important;color:#fff!important}
nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:28px;box-shadow:0 6px 18px rgba(11,58,107,.22);padding:6px}
nav button{flex:1;min-width:0;min-height:56px;border:0;background:none;font:inherit;font-size:14.5px;padding:4px 0;color:var(--g);border-radius:18px;transition:font-size .15s}
.gcat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gcat button{border:2px solid var(--line);background:var(--card);border-radius:14px;min-height:92px;font:inherit;color:var(--t);padding:10px}
.gcat .ic{font-size:30px;display:block}.gcat b{display:block;margin-top:4px}.gcat span{font-size:14px;color:var(--g)}
.gr{font-size:20px;font-weight:700}.pr{color:var(--b2);font-weight:600}
.rc{border:1px solid #e6c3c0;background:#fdf8f7}
.rt{color:var(--r);font-weight:700;font-size:16px}
.rc .it a{background:#f9e9e8;color:var(--r)}
.plan{border:3px solid var(--b);box-shadow:0 3px 10px rgba(11,58,107,.12)}
.pt{color:var(--b);font-weight:800;font-size:18px}
nav .on{background:#e4ecf4;color:var(--b);font-weight:800;font-size:16.5px}
#toast{position:fixed;left:16px;right:16px;bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--t);color:#fff;padding:12px 14px;border-radius:12px;display:none;z-index:9}

const V={s:vS,f:vF,t:vT,g:vG,d:vD,x:vX,c:vC},N=[['s','일정'],['f','항공'],['t','번역'],['g','그리스어'],['d','일기'],['x','경비']];

if(d.t){if(d.t==='s'){const n=now();if(K.includes(n))sel=n;pm=false;pe=null;exp=null}go(d.t)}
else if(d.go)go(d.go);else if(d.s){sel=d.s;pm=false;pe=null;exp=null;go('s')}

else if(d.ri!==undefined){const i=+d.ri,key='r:'+sel+':'+i,p=REC[sel][i];exp=exp===key?null:key;go('s',1);
if(exp===key&&!IC[key]){getInfo(key,p.b,p.q).then(()=>{if(exp===key){const el=$('#pinfo');el&&(el.innerHTML=infoInner(IC[key]))}})}}
else if(d.ed!==undefined){pe=+d.ed;go('s',1)}

else if(b.id==='pm'){pm=!pm;pe=null;exp=null;go('s',1)}
else if(b.id==='pc'){pe=null;go('s',1)}
else if(b.id==='pa'){const tv=$('#pt').value.trim(),fv=$('#pf').value.trim(),bv=$('#pb').value.trim(),mv=$('#pn2').value.trim();
if(!bv&&!mv){msg('도착지(장소)나 메모를 입력하세요.');return}
if(fv&&!bv){msg('출발지를 넣었으면 도착지도 입력하세요.');return}
const L=PL(sel),old=pe!=null?L[pe]:null,o={};
if(tv)o.t=tv;if(fv)o.a=fv;if(bv)o.b=bv;if(mv)o.n=mv;
if(bv)o.q=(old&&(old.b===bv||old.n===bv)&&old.q)?old.q:bv;
if(old&&old.w&&!bv&&!fv)o.w=1;
if(pe!=null)L[pe]=o;else L.push(o);
pe=null;save();msg('저장했습니다.');go('s',1)}
else if(d.lgx!==undefined){S.lg.splice(+d.lgx,1);save();go('c',1)}
else if(b.id==='lga'){const n=$('#lgn').value.trim(),ci=$('#lgi').value,co=$('#lgo').value,ad=$('#lgd').value.trim();

S.lg.push({n,ci,co,ad});S.lg.sort((a,b2)=>a.ci<b2.ci?-1:1);save();msg('숙소를 저장했습니다.');go('c',1)}

else if(d.r){S.sr=+d.r;save();const o=$('#to');if(o&&tR)o.innerHTML=resHtml()}
else if(d.s2){sel=d.s2;$('#ds').value=sel;$('#dx').value=S.d[sel];scrollTo(0,0)}
else if(d.e){const x=S.e.find(z=>z.id==d.e);ed=x.id;$('#xd').value=x.d;$('#xn').value=x.n;$('#xa').value=x.a;$('#xc').value=x.c;$('#xm').value=x.m;$('#xx').style.display='';$('#xs').textContent='수정 저장';scrollTo(0,0)}

if(ed)S.e=S.e.map(z=>z.id===ed?r:z);else S.e.push(r);ed=null;save();msg('저장했습니다.');go('x')}
else if(b.id==='xx'){S.e=S.e.filter(z=>z.id!==ed);ed=null;save();msg('삭제했습니다.');go('x')}

const t=[...oSel].sort((a,b2)=>a-b2).map(i=>oL[i]).join(' ');tQ=t;$('#ti').value=t;doTr()}
else if(b.id==='oall'){const t=oL.join(' ');tQ=t;$('#ti').value=t;doTr()}
else if(b.id==='tr')doTr();
else if(b.id==='sw'){const z=S.ts;S.ts=S.tt;S.tt=z;save();const i=$('#ti');if(i)tQ=i.value;go('t')}
else if(b.id==='sp')speak();
else if(b.id==='fx')fx(1);else if(b.id==='ex')ex();else if(b.id==='im')$('#fi').click()});
/* 손가락 드래그로 일정 순서 바꾸기 */
let dEl=null,dList=null,dKey=null;
document.addEventListener('pointerdown',e=>{const h=e.target.closest('.hdl');if(!h)return;e.preventDefault();
dEl=h.closest('.pit');dList=dEl.parentElement;dKey=dList.dataset.k;dEl.classList.add('drg');

base=new Date(2026,10,23),df=Math.round((t0-base)/86400000);
